services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://orders:orders@db:5432/orders
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      CLIENT_ID: ${CLIENT_ID:-demo-trader}
      CLIENT_SECRET: ${CLIENT_SECRET:-demo-secret}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 3
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:

